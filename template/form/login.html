{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Web Poets Society</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/bootstrap-icons/bootstrap-icons.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
  <div class="container py-5" style="max-width: 460px;">

    <div class="text-center mb-4">
      <span class="brand-icon"><i class="bi bi-book-half" aria-hidden="true"></i></span>
      <h1 class="h4 mt-3 mb-1">Web Poets Society</h1>
      <p class="text-muted mb-0">Entre para continuar.</p>
    </div>

    <section class="panel p-4">

      {% if form.errors %}
        <div class="alert alert-danger" role="alert">
          Usuário ou senha inválidos.
        </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100 mt-3" type="submit">
          <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar
        </button>
      </form>

      <hr class="my-4">

      <a class="btn btn-outline-secondary w-100" href="{% url 'usuario_criar' %}">
        <i class="bi bi-person-plus" aria-hidden="true"></i> Criar uma conta
      </a>

    </section>
  </div>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
