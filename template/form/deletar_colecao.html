{% extends "base.html" %}

{% block title %}Deletar Coleção | Web Poets Society{% endblock %}

{% block content %}

<div class="container-fluid px-3 px-lg-4 py-4">

  <div class="page-heading">

    <div class="page-heading-copy">

      <span class="page-icon">
        <i class="bi bi-trash" aria-hidden="true"></i>
      </span>

      <div>

        <p class="eyebrow mb-1">Acervo</p>

        <h1 class="h3 mb-1">
          Deletar Coleção
        </h1>

      </div>

    </div>

  </div>


  <section class="panel">

    <p>
      Tem certeza que deseja deletar a coleção
      <strong>{{ colecao.titulo }}</strong>?
    </p>

    <p class="text-muted">
      Essa ação não poderá ser desfeita.
    </p>


    <form method="POST">

      {% csrf_token %}

      <div class="d-flex gap-2">

        <a
          href="{% url 'colecao:lista' %}"
          class="btn btn-secondary"
        >
          Cancelar
        </a>

        <button
          type="submit"
          class="btn btn-danger"
        >
          Deletar
        </button>

      </div>

    </form>

  </section>

</div>

{% endblock %}
