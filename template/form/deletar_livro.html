{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Deletar Livro</h2>

    <p>
        Tem certeza que deseja deletar o livro
        <strong>{{ livro.titulo }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Deletar
        </button>

        <a href="{% url 'livros:lista' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>

</div>

{% endblock %}
