{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Editar Edição</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Salvar alterações
        </button>

        <a href="{% url 'home' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>

</div>

{% endblock %}
