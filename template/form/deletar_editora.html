{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Deletar Editora</h2>

    <p>
        Tem certeza que deseja deletar esta editora?
    </p>

    <p>
        <strong>{{ editora.endereco }}</strong>
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Deletar
        </button>

        <a href="{% url 'home' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>

</div>

{% endblock %}
