{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 | Web Poets Society</title>

  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/bootstrap-icons/bootstrap-icons.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle
          aria-label="Trocar tema">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
  </button>

  <main class="error-page">
    <section class="error-card">
      <a class="auth-brand justify-content-center" href="/">
        <span class="brand-icon"><i class="bi bi-book-half" aria-hidden="true"></i></span>
        <span><strong>Web Poets Society</strong><small>Erro 500</small></span>
      </a>
      <div class="error-code">500</div>
      <h1 class="h3 mb-2">Erro interno do servidor</h1>
      <p class="text-muted mb-4">Algo deu errado do nosso lado. Tente novamente em instantes.</p>
      <div class="d-flex flex-wrap justify-content-center gap-2">
        <a class="btn btn-primary" href="/">
          <i class="bi bi-speedometer2" aria-hidden="true"></i> Voltar ao início
        </a>
        <a class="btn btn-outline-secondary" href="/login/">Entrar</a>
      </div>
    </section>
  </main>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
